[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "senai"
version = "0.1.0"
description = "A small Codex CLI wrapper for writing and editing code"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "croniter==6.2.4",
    "python-dateutil==3.0.0",
    "six==1.17.0",
    "tzdata==2026.6",
]

[project.scripts]
senai = "senai.cli:main"

[tool.setuptools.packages.find]
include = ["senai", "senai.*"]
